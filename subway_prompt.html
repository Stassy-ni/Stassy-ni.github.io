<script>
const WORLDS = [
  {
    id:'tokyo',
    label:'Неоновый Токио',
    emoji:'🌃',
    tagline:'Ночной киберпанк, неон и мокрый асфальт',
    heroDefault:'magenta',
    titlePlaceholder:'Например: Cyber Dash',
    promptBlock:
`Визуальный стиль и Арт-дирекшн: Игра должна выглядеть сочно в стилистике ночного неонового Токио.
Окружение: Дорога состоит из 3 полос. Покрытие — темно-серый асфальт. Разметка между полосами — ярко-розовые неоновые пунктиры (используй shadowBlur для свечения).
Процедурный декор: За обочинами генерируй силуэты японских небоскребов разной высоты с вертикальными светящимися вывесками (розовые и синие).
Объекты: Препятствия — кибер-барьеры (отрисовывай им переднюю, верхнюю и боковую грань разными оттенками, чтобы они казались объемными). Монетки — фиолетовые ромбы.
Частицы: При столкновении взрыв из квадратных неоново-розовых частиц.`
  },
  {
    id:'ruins',
    label:'Древние Руины',
    emoji:'🗿',
    tagline:'Заброшенные руины в джунглях, солнце и мох',
    heroDefault:'amber',
    titlePlaceholder:'Например: Затерянный храм',
    promptBlock:
`Визуальный стиль и Арт-дирекшн: Игра должна выглядеть атмосферно в стилистике заброшенных руин в джунглях.
Окружение: Дорога состоит из 3 полос. Покрытие — песчаная каменная плитка. Разметка — трещины с прорастающим зеленым мохом.
Процедурный декор: За обочинами генерируй каменные колонны и пирамиды (отрисовывай грани разными оттенками для придания фейкового объема). Добавь факелы с анимированным огнем.
Объекты: Препятствия — упавшие каменные блоки и сундуки. Монетки — золотые древние артефакты.
Частицы: При столкновении взрыв из квадратных каменных частиц.`
  },
  {
    id:'space',
    label:'Космостанция',
    emoji:'🚀',
    tagline:'Гигантская станция среди звёзд, металл и неон',
    heroDefault:'cyan',
    titlePlaceholder:'Например: Star Runner',
    promptBlock:
`Визуальный стиль и Арт-дирекшн: Игра должна выглядеть футуристично в стилистике космической станции.
Окружение: Дорога состоит из 3 полос. Покрытие — металлическая обшивка с решетками. Разметка — голубые светодиодные полосы (используй shadowBlur для свечения).
Процедурный декор: За обочинами генерируй отсеки космостанции и антенны (рисуй грани разными цветами для эффекта 3D). Добавь мерцающие красные датчики.
Объекты: Препятствия — ящики с биоопасностью и лазерные перегородки. Монетки — голубые энерго-сферы.
Частицы: При столкновении взрыв из голубых искр (мелкие квадраты).`
  }
];

const HERO_COLORS = [
  {id:'cyan', label:'Голубой', hex:'#4fd6e8'},
  {id:'amber', label:'Янтарный', hex:'#ffb84d'},
  {id:'magenta', label:'Розовый', hex:'#ff5fa8'},
  {id:'green', label:'Зелёный', hex:'#5bd97a'},
  {id:'white', label:'Белый', hex:'#f2f5ff'}
];

const state = {
  world: 'tokyo',
  hero: 'magenta',
  heroTouched: false,
};

// Обновленные превьюшки для карточек
function worldThumbSVG(w){
  if(w.id==='tokyo') return `<svg viewBox="0 0 150 92" preserveAspectRatio="xMidYMid slice" style="width:100%;height:100%;display:block;"><rect width="150" height="92" fill="#0a0a23"/><rect x="0" y="30" width="40" height="62" fill="#171233"/><rect x="20" y="14" width="35" height="78" fill="#1d1640"/><rect x="110" y="24" width="40" height="68" fill="#171233"/><rect x="95" y="35" width="30" height="57" fill="#1d1640"/><rect x="25" y="40" width="3" height="14" fill="#ff4ecd"/><rect x="115" y="50" width="3" height="14" fill="#7c5cff"/><polygon points="55,92 95,92 80,20 70,20" fill="#22242f"/><line x1="75" y1="92" x2="75" y2="20" stroke="#ff4ecd" stroke-width="2" stroke-dasharray="6 5"/></svg>`;
  if(w.id==='ruins') return `<svg viewBox="0 0 150 92" preserveAspectRatio="xMidYMid slice" style="width:100%;height:100%;display:block;"><rect width="150" height="92" fill="#2d4a22"/><circle cx="30" cy="20" r="10" fill="#ffe4a0"/><polygon points="-10,92 30,30 70,92" fill="#3a5230"/><polygon points="80,92 120,40 160,92" fill="#3a5230"/><rect x="15" y="34" width="20" height="58" fill="#7a6a52"/><rect x="10" y="28" width="30" height="7" fill="#8d7c62"/><rect x="115" y="30" width="20" height="62" fill="#7a6a52"/><rect x="110" y="24" width="30" height="7" fill="#8d7c62"/><polygon points="55,92 95,92 80,20 70,20" fill="#8c7a58"/><line x1="75" y1="92" x2="75" y2="20" stroke="#5fd97a" stroke-width="2" stroke-dasharray="5 6"/></svg>`;
  return `<svg viewBox="0 0 150 92" preserveAspectRatio="xMidYMid slice" style="width:100%;height:100%;display:block;"><rect width="150" height="92" fill="#050510"/><circle cx="20" cy="14" r="1" fill="#fff"/><circle cx="50" cy="24" r="1" fill="#fff"/><circle cx="120" cy="16" r="1" fill="#fff"/><rect x="0" y="24" width="35" height="68" fill="#12172e"/><rect x="20" y="40" width="35" height="52" fill="#19203f"/><rect x="115" y="18" width="35" height="74" fill="#12172e"/><rect x="95" y="35" width="30" height="57" fill="#19203f"/><circle cx="35" cy="55" r="2" fill="#4fd6e8"/><circle cx="110" cy="45" r="2" fill="#ff5c5c"/><polygon points="55,92 95,92 80,20 70,20" fill="#2c313f"/><line x1="75" y1="92" x2="75" y2="20" stroke="#4fd6e8" stroke-width="2" stroke-dasharray="6 5"/></svg>`;
}

function findWorld(id){ return WORLDS.find(w => w.id === id); }
function findHero(id){ return HERO_COLORS.find(h => h.id === id); }

document.getElementById('worldRow').innerHTML = WORLDS.map(w => `
  <button class="world-card" data-id="${w.id}" type="button">
    <div class="thumb">${worldThumbSVG(w)}</div>
    <div style="padding: 0 4px 4px;">
      <div class="name">${w.emoji} ${w.label}</div>
      <div class="tagline">${w.tagline}</div>
    </div>
    <div class="check">✓</div>
  </button>`).join('');

document.getElementById('heroRow').innerHTML = HERO_COLORS.map(h => `
  <button class="swatch" data-id="${h.id}" type="button">
    <span class="dot" style="background:${h.hex};color:${h.hex}"></span>
    <span>${h.label}</span>
  </button>`).join('');

const titleInput = document.getElementById('titleInput');

function render(){
  const world = findWorld(state.world);

  document.querySelectorAll('.world-card').forEach(btn => {
    btn.classList.toggle('selected', btn.getAttribute('data-id') === state.world);
  });
  document.querySelectorAll('.swatch').forEach(btn => {
    btn.classList.toggle('selected', btn.getAttribute('data-id') === state.hero);
  });

  ['tokyo','ruins','space'].forEach(id => {
    document.getElementById('world-' + id).style.display = state.world === id ? '' : 'none';
  });

  const heroHex = findHero(state.hero).hex;
  document.querySelectorAll('.char-fill').forEach(el => el.setAttribute('fill', heroHex));

  document.getElementById('worldNameHud').textContent = world.label.toUpperCase();
  titleInput.placeholder = world.titlePlaceholder;

  updatePrompt();
}

document.getElementById('worldRow').addEventListener('click', (e) => {
  const btn = e.target.closest('.world-card');
  if(!btn) return;
  state.world = btn.getAttribute('data-id');
  if(!state.heroTouched){
    state.hero = findWorld(state.world).heroDefault;
  }
  render();
});

document.getElementById('heroRow').addEventListener('click', (e) => {
  const btn = e.target.closest('.swatch');
  if(!btn) return;
  state.hero = btn.getAttribute('data-id');
  state.heroTouched = true;
  render();
});

titleInput.addEventListener('input', updatePrompt);

function buildPrompt(){
  const world = findWorld(state.world);
  const hero = findHero(state.hero);
  const title = titleInput.value.trim() || world.titlePlaceholder.replace('Например: ', '');

  return `Ты — опытный геймдизайнер и Frontend-разработчик. Твоя задача — написать аркадную игру "Endless Runner" (с механикой 3 полос, как в Subway Surf), используя ТОЛЬКО чистый HTML5 Canvas и Vanilla JavaScript. 
КРИТИЧЕСКОЕ УСЛОВИЕ: ЗАПРЕЩЕНО использовать Three.js, WebGL или любые другие 3D-библиотеки. 

Название игры: ${title}

${world.promptBlock}

— Иллюзия 3D (Изометрия / 2.5D): Игра должна иметь вид сверху под углом (Изометрическая проекция или топ-даун с перспективой). Дорога идет вертикально (снизу вверх) или по диагонали. Объекты спавнятся сверху экрана и движутся вниз навстречу игроку. Чтобы создать иллюзию объема, отрисовывай препятствиям и зданиям боковые и верхние грани (фейковый 3D через полигоны 2D Canvas).
— Модель игрока: Никаких картинок. Главный герой — футуристичный транспорт, нарисованный через Canvas API (состоящий из нескольких полигонов для имитации объема). Основной цвет: ${hero.label.toLowerCase()} (${hero.hex}). Добавь красивое неоновое свечение через ctx.shadowBlur.

[ТЕХНИЧЕСКИЕ ТРЕБОВАНИЯ]
— Формат: строго ОДИН файл index.html. Весь CSS, HTML и JavaScript — внутри этого файла.
— Никаких внешних файлов — вся графика рисуется кодом.
— Оптимизация: используй requestAnimationFrame и удаляй объекты, вышедшие за нижний край экрана.

Логика и геймплей:
— 3 полосы движения. Игрок находится внизу экрана и плавно меняет полосы по оси X.
— Прыжок: При нажатии на прыжок, игрок визуально подлетает вверх (координата Y отрисовки поднимается, а под ним рисуется отдаляющаяся тень). Прыжок должен быть затяжным и плавным ("лунная гравитация").
— СКОРОСТЬ: Стартовая скорость спавна и движения ДОЛЖНА БЫТЬ ОЧЕНЬ МЕДЛЕННОЙ, чтобы игрок успел привыкнуть. Со временем скорость плавно увеличивается.
— АНТИ-ТУПИК: Препятствия спавнятся так, чтобы МИНИМУМ 1 из 3 полос ВСЕГДА была свободна и безопасна.
— ПРОЩАЮЩИЕ КОЛЛИЗИИ: Хитбокс (зона столкновения) препятствий должен быть меньше их визуального размера, чтобы случайное касание краем не убивало игрока.
— ЖИЗНИ: На старте у игрока 3 жизни (отобрази их как ♥♥♥). При ударе отнимается 1 жизнь, происходит эффект сотрясения экрана, а игрок мигает (неуязвимость на 1.5 секунды). Если жизней 0 — Game Over.
— Подсчёт очков (зависят от дистанции и собранных монет).

Управление:
— ПК: Стрелки Влево/Вправо (или A/D) — смена полосы. Пробел или Вверх — прыжок.
— Смартфоны (Mobile): Обязательно слушатели touchstart/touchend для свайпов (влево/вправо/вверх). Тап по экрану для старта/рестарта.

UI / Интерфейс:
— Нарисуй красивый HTML-интерфейс поверх Canvas (абсолютное позиционирование).
— Стартовый экран с названием игры и правилами.
— HUD в процессе игры: Жизни (♥♥♥), Счёт, Монеты.
— Экран Game Over с финальным счетом и кнопкой рестарта.

Сгенерируй только код, без лишних рассуждений.`;
}

function updatePrompt(){
  document.getElementById('promptOutput').value = buildPrompt();
}

document.getElementById('copyBtn').addEventListener('click', () => {
  const textarea = document.getElementById('promptOutput');
  const feedback = document.getElementById('feedback');
  function showFeedback(){
    feedback.classList.add('show');
    setTimeout(() => feedback.classList.remove('show'), 2200);
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(textarea.value).then(showFeedback).catch(() => {
      textarea.select();
      document.execCommand('copy');
      showFeedback();
    });
  } else {
    textarea.select();
    document.execCommand('copy');
    showFeedback();
  }
});

render();
</script>
