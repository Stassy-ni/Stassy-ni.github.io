<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Джунгли</title>
<style>
:root{--bg:#0b1a12;--fg:#e8f3df;--acc:#f2c230;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#08130c}}
:root[data-theme="dark"]{--bg:#08130c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:16px system-ui,sans-serif;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none;user-select:none}
#wrap{position:relative;width:min(100vw,calc(100vh*960/544));aspect-ratio:960/544}
canvas{width:100%;height:100%;display:block}
#ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(6,20,12,.78);text-align:center;padding:16px}
#ov h1{margin:0;font:700 clamp(26px,6vw,48px) Georgia,serif;color:var(--acc)}
#ov p{margin:0 0 6px;font-size:clamp(14px,2.4vw,20px)}
button{font:700 clamp(15px,2.6vw,20px) system-ui;padding:10px 22px;border:0;border-radius:10px;background:#2c9a5a;color:#fff;cursor:pointer}
button.s{background:#3a4d41}

.tb{width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.22);color:#fff;font:700 26px/64px system-ui;text-align:center;display:inline-block;margin:0 4px}
@media (pointer:coarse){#tc{display:flex}}
</style></head><body>
<div id="wrap"><canvas id="cv"></canvas>
<div id="bt"><button id="mb" class="s">Звук</button><button id="pb" class="s">Пауза</button></div>
<div id="tc"><div><span class="tb" data-k="l">◀</span><span class="tb" data-k="r">▶</span></div><div><span class="tb" data-k="j">▲</span></div></div>
<div id="ov"></div></div>
<script>
const W=960,H=544,T=32,ROWS=17,$=i=>document.getElementById(i);
const cv=$('cv'),ctx=cv.getContext('2d'),dpr=Math.min(devicePixelRatio||1,2);
cv.width=W*dpr;cv.height=H*dpr;
const mul=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
/* сохранения */
let SV={lvl:1,tut:0,stars:{}};
try{Object.assign(SV,JSON.parse(localStorage.getItem('jg1')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('jg1',JSON.stringify(SV))}catch(e){}};
/* звук */
let ac,mute=false;
const initAudio=()=>{try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();ac.resume()}catch(e){}};
function beep(f,d,ty,v,f2){if(!ac||mute)return;const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;o.type=ty||'square';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v||.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(t+d)}
/* генерация уровня */
function gen(L,off){
 const R=mul(L*7919+13+off),d=Math.max(L,1),tut=L===0,len=tut?0:Math.min(70+d*9,190);
 const g=[];for(let y=0;y<ROWS;y++)g.push(new Uint8Array(260));
 const E=[],B=[],C=[],hints=[];let x=0,gh=13,lastC=0,tot=null;
 const gmax=Math.min(4,1+Math.ceil(d/2)),espd=(.5+Math.min(d,10)*.07)*60,cpd=22+d*1.5;
 const fill=(x0,n,h)=>{for(let i=x0;i<x0+n;i++)for(let y=h;y<ROWS;y++)g[y][i]=1};
 const ban=(x0,n,yp)=>{for(let i=0;i<n;i++)B.push({x:(x0+i)*T+16,y:yp-Math.sin(i/(n-1||1)*Math.PI)*24,got:0})};
 const hint=t=>hints.push({x:x*T,t});
 const flat=(n,o)=>{o=o||{};fill(x,n,gh);
  if(o.ban&&n>=3)ban(x+1,Math.min(n-2,5),(gh-2)*T+16);
  if(n>=3&&x-lastC>cpd){C.push({x:(x+1)*T+16,y:gh*T,on:0});lastC=x}
  if(o.en)E.push({x:(x+n/2)*T,y:gh*T,d:1,a:x*T+14,b:(x+n)*T-14,v:espd,al:1});
  if(o.sp){const sx=x+(n>>1);g[gh-1][sx]=3;if(o.sp>1)g[gh-1][sx+1]=3}
  if(o.lg&&n>=5){for(let i=1;i<4;i++)g[gh-3][x+i]=2;ban(x+1,3,(gh-4)*T+16)}
  x+=n};
 const gap=w=>{if(w>=3&&R()<.6)g[gh+1][x+(w>>1)]=2;if(R()<.6)ban(x,w,(gh-3)*T+16);x+=w};
 const step=dh=>{gh=Math.max(8,Math.min(14,gh+dh))};
 flat(9);
 if(tut){hint('Беги: стрелки ← → или A D');flat(10);hint('Прыжок: пробел или ↑');gap(1);flat(6);
  hint('Держи прыжок дольше — прыгнешь выше');step(-2);flat(6);hint('Собери бананы');flat(8,{ban:1});
  hint('Прыгни на жука сверху');flat(10,{en:1});hint('Дойди до тотема — это финиш')}
 else{let k=0;while(x<len){const r=R();k++;
  if(k%5===0)flat(6,{ban:1});
  else if(r<.3)flat(3+(R()*4|0),{ban:R()<.5});
  else if(r<.56){gap(1+(R()*gmax|0));flat(3)}
  else if(r<.68){step((R()<.5?-1:1)*(1+(R()*2|0)));flat(4)}
  else if(r<.8&&d>=2)flat(6+(R()*3|0),{en:1,ban:R()<.4});
  else if(r<.9&&d>=3)flat(6,{sp:d>=6?2:1});
  else flat(6,{lg:1})}}
 flat(3);const x0=x;flat(10);tot={x:(x0+5)*T+16,y:gh*T};
 return{g,E,B,C,hints,lw:x,tot,tut,d,L}}
function ok(G){let last=-1,gp=0;for(let i=0;i<G.lw;i++){let s=-1;for(let y=0;y<ROWS;y++){const v=G.g[y][i];if(v===1||v===2){s=y;break}}
 if(s<0){if(++gp>4)return 0}else{if(last>=0&&last-s>3)return 0;gp=0;last=s}}return G.tot&&G.lw>20}
/* состояние */
let G,P,st='menu',cam=0,cp,nb=0,NB=0,K={l:0,r:0,j:0},JP=0,parts=[],hurtT=0;
const solid=(x,y)=>x<0||x>=G.lw?x<0:y<0||y>=ROWS?false:G.g[y][x]===1||G.g[y][x]===2;
function hit(p){if(p.x<11||p.x>G.lw*T-11)return 1;const x0=Math.floor((p.x-11)/T),x1=Math.floor((p.x+10.99)/T),y0=Math.floor((p.y-34)/T),y1=Math.floor((p.y-.01)/T);
 for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)if(solid(x,y))return 1;return 0}
function mv(p,dx,dy){p.x+=dx;if(hit(p)){p.x-=dx;p.vx=0}
 p.y+=dy;if(hit(p)){if(dy>0){p.y=Math.floor(p.y/T)*T;p.gr=1;p.co=.1}else p.y=Math.ceil((p.y-34)/T)*T+34;p.vy=0}}
function dust(x,y,n){for(let i=0;i<n&&parts.length<60;i++)parts.push({x,y,vx:(Math.random()-.5)*90,vy:-Math.random()*60,l:.4})}
function start(L){let o=0,g=gen(L,0);while(!ok(g)&&o<20)g=gen(L,++o);G=g;
 P={x:2*T,y:13*T,vx:0,vy:0,f:1,gr:0,co:0,jb:0,jm:0,hp:3,inv:0,sq:0,t:0};
 cp={x:2*T,y:13*T};cam=0;nb=0;NB=G.B.length;parts=[];st='play';ov()}
function respawn(){P.x=cp.x;P.y=cp.y;P.vx=P.vy=0;P.inv=1.5;if(!G.tut&&--P.hp<=0)lose()}
function hurt(){if(P.inv>0)return;P.inv=1.5;P.vy=-380;P.vx=-P.f*180;beep(150,.3,'sawtooth',.08,60);if(!G.tut&&--P.hp<=0)lose()}
function lose(){st='lose';ov('Не вышло','Ты потерял все сердца. Попробуй ещё раз!',[['Заново',()=>start(G.L)]])}
function win(){st='win';beep(523,.12);setTimeout(()=>beep(659,.12),120);setTimeout(()=>beep(784,.12),240);setTimeout(()=>beep(1047,.3),360);
 const L=G.L,s=1+(nb>=.8*NB?1:0)+(P.hp===3?1:0);
 if(L===0){SV.tut=1;save();ov('Обучение пройдено!','Теперь ты готов к настоящим джунглям',[['Играть',()=>start(1)]]);return}
 SV.stars[L]=Math.max(SV.stars[L]||0,s);SV.lvl=Math.max(SV.lvl,L+1);save();
 ov('Уровень '+L+' пройден!','★'.repeat(s)+'☆'.repeat(3-s)+'  Бананы: '+nb+'/'+NB,[['Дальше',()=>start(L+1)],['Повторить',()=>start(L),'s']])}
function pause(){if(st!=='play')return;st='pause';ov('Пауза','',[['Продолжить',resume]])}
function resume(){if(st==='pause'){st='play';ov()}}
function ov(t,p,bs){const e=$('ov');if(!t){e.style.display='none';return}e.style.display='flex';e.innerHTML='';
 const h=document.createElement('h1');h.textContent=t;e.appendChild(h);if(p){const q=document.createElement('p');q.textContent=p;e.appendChild(q)}
 (bs||[]).forEach(b=>{const x=document.createElement('button');x.textContent=b[0];x.className=b[2]||'';x.onclick=()=>{initAudio();b[1]()};e.appendChild(x)})}
function menu(){st='menu';ov('Джунгли','Собирай бананы и дойди до древнего тотема',[[SV.tut?'Играть (уровень '+SV.lvl+')':'Начать обучение',()=>start(SV.tut?SV.lvl:0)]].concat(SV.tut?[]:[['Пропустить обучение',()=>{SV.tut=1;save();start(1)},'s']]))}
/* ввод */
const km={ArrowLeft:'l',KeyA:'l',ArrowRight:'r',KeyD:'r',ArrowUp:'j',KeyW:'j',Space:'j'};
addEventListener('keydown',e=>{const k=km[e.code];if(k){e.preventDefault();initAudio();if(k==='j'&&!K.j)JP=1;K[k]=1}
 else if(e.code==='Escape'||e.code==='KeyP')st==='play'?pause():resume();else if(e.code==='KeyM')mute=!mute});
addEventListener('keyup',e=>{const k=km[e.code];if(k)K[k]=0});
document.querySelectorAll('.tb').forEach(b=>{const k=b.dataset.k;b.addEventListener('pointerdown',e=>{e.preventDefault();initAudio();if(k==='j')JP=1;K[k]=1});
 ['pointerup','pointerleave','pointercancel'].forEach(n=>b.addEventListener(n,()=>K[k]=0))});
$('pb').onclick=()=>st==='play'?pause():resume();$('mb').onclick=()=>{mute=!mute;$('mb').textContent=mute?'Без звука':'Звук'};
addEventListener('blur',()=>{K.l=K.r=K.j=0;pause()});
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});
window.onerror=()=>{st='err';ov('Что-то пошло не так','Перезапусти игру',[['Перезапустить',()=>location.reload()]])};
/* обновление */
function upd(dt){
 if(st==='menu'){cam+=dt*40;return}
 if(st!=='play')return;
 const p=P,ax=(K.r?1:0)-(K.l?1:0);p.t+=dt;
 if(ax){p.f=ax;p.vx+=ax*1600*dt}else{const f=1400*dt;p.vx=Math.abs(p.vx)<=f?0:p.vx-Math.sign(p.vx)*f}
 p.vx=Math.max(-220,Math.min(220,p.vx));
 if(JP){p.jb=.12;JP=0}p.jb-=dt;p.co-=dt;p.inv-=dt;p.sq-=dt;
 if(p.jb>0&&p.co>0){p.vy=-660;p.jb=0;p.co=0;p.jm=1;beep(420,.15,'square',.05,780)}
 if(!K.j&&p.jm&&p.vy<0){p.vy*=.45;p.jm=0}
 if(p.vy>=0)p.jm=0;
 p.vy=Math.min(p.vy+1900*dt,900);
 const was=p.gr,pv=p.vy;p.gr=0;mv(p,p.vx*dt,p.vy*dt);
 if(p.gr&&!was&&pv>300){p.sq=.12;dust(p.x,p.y,6)}
 if(p.y>ROWS*T+120){beep(120,.4,'sawtooth',.07,50);respawn()}
 const ty=Math.floor((p.y-1)/T);
 for(let tx=Math.floor((p.x-8)/T);tx<=Math.floor((p.x+8)/T);tx++)if(G.g[ty]&&G.g[ty][tx]===3&&p.y>ty*T+14)hurt();
 for(const e of G.E){if(!e.al)continue;e.x+=e.d*e.v*dt;if(e.x<e.a){e.x=e.a;e.d=1}if(e.x>e.b){e.x=e.b;e.d=-1}
  if(Math.abs(p.x-e.x)<22&&p.y>e.y-20&&p.y-34<e.y){if(p.vy>50&&p.y<e.y-8){e.al=0;p.vy=-420;beep(300,.12,'square',.06,600);dust(e.x,e.y,8)}else hurt()}}
 for(const b of G.B)if(!b.got&&Math.abs(p.x-b.x)<20&&Math.abs(p.y-17-b.y)<24){b.got=1;nb++;beep(880,.08,'triangle',.07,1320)}
 for(const c of G.C)if(!c.on&&p.x>c.x){c.on=1;cp=c;beep(660,.15,'triangle',.06)}
 if(Math.abs(p.x-G.tot.x)<24&&p.y>G.tot.y-90)win();
 const tg=Math.max(0,Math.min(G.lw*T-W,p.x-W/2+p.f*60));cam+=(tg-cam)*Math.min(1,dt*8);
 for(let i=parts.length-1;i>=0;i--){const q=parts[i];q.x+=q.vx*dt;q.y+=q.vy*dt;if((q.l-=dt)<=0)parts.splice(i,1)}
}
/* графика */
function mk(w,fn){const c=document.createElement('canvas');c.width=w;c.height=H;fn(c.getContext('2d'));return c}
const far=mk(1920,x=>{const R=mul(5);x.fillStyle='rgba(20,90,70,.55)';for(let i=0;i<26;i++){const cx=R()*1920,cy=250+R()*140,r=50+R()*60;[0,-1920,1920].forEach(o=>{x.beginPath();x.ellipse(cx+o,cy,r*1.3,r,0,0,7);x.fill()})}
 x.fillStyle='rgba(255,240,170,.08)';for(let i=0;i<7;i++){const a=R()*1800;x.beginPath();x.moveTo(a,0);x.lineTo(a+60,0);x.lineTo(a+200,H);x.lineTo(a+90,H);x.fill()}});
const mid=mk(1920,x=>{const R=mul(9);for(let i=0;i<14;i++){const cx=60+R()*1800,w=18+R()*16;x.fillStyle='#143626';x.fillRect(cx,0,w,H);x.fillStyle='#1d4a34';x.fillRect(cx+3,0,4,H)}
 x.strokeStyle='#2f8a4e';x.lineWidth=3;for(let i=0;i<22;i++){const vx=R()*1900,l=80+R()*180;x.beginPath();x.moveTo(vx,0);x.bezierCurveTo(vx+25,l*.4,vx-25,l*.7,vx+8,l);x.stroke()}
 x.fillStyle='#1f6a3f';for(let i=0;i<30;i++){x.beginPath();x.ellipse(R()*1920,R()*70,30+R()*30,14+R()*12,R(),0,7);x.fill()}});
const SK=ctx.createLinearGradient(0,0,0,H);SK.addColorStop(0,'#0f3d3a');SK.addColorStop(.6,'#3f8f5a');SK.addColorStop(1,'#a8d86e');
const FF=(r=>Array.from({length:26},(_,i)=>({x:r()*W,y:80+r()*350,p:i})))(mul(3));
const lay=(l,f)=>{const o=-((cam*f)%1920);ctx.drawImage(l,o,0,1920,H);ctx.drawImage(l,o+1920,0,1920,H)};
function tiles(){const c=ctx,g=G.g,x0=Math.max(0,Math.floor(cam/T)),x1=Math.min(G.lw-1,x0+31);
 for(let ty=0;ty<ROWS;ty++)for(let tx=x0;tx<=x1;tx++){const v=g[ty][tx];if(!v)continue;const X=tx*T-cam,Y=ty*T;
  if(v===3){c.fillStyle='#dcdccb';for(let i=0;i<3;i++){c.beginPath();c.moveTo(X+i*10.7,Y+T);c.lineTo(X+i*10.7+5.3,Y+10);c.lineTo(X+i*10.7+10.7,Y+T);c.fill()}continue}
  c.fillStyle=v===1?'#6b4a2b':'#7a5530';c.fillRect(X,Y,T,T);
  c.fillStyle='rgba(0,0,0,.18)';c.fillRect(X+((tx*13+ty*7)%22),Y+12+((tx*5+ty*11)%14),5,3);
  const up=ty>0?g[ty-1][tx]:0;
  if(up!==1&&up!==2){c.fillStyle='#2e8b57';c.fillRect(X,Y,T,8);c.fillStyle='#a8d86e';c.fillRect(X,Y,T,3);c.fillStyle='#2e8b57';
   for(let i=0;i<3;i++){const bx=X+4+i*10+(tx*3%4);c.beginPath();c.moveTo(bx,Y);c.lineTo(bx+3,Y-4-(tx+i)%3*2);c.lineTo(bx+6,Y);c.fill()}}}}
function drawP(){const p=P,c=ctx;if(p.inv>0&&Math.floor(p.inv*12)%2)return;
 const sp=Math.abs(p.vx)/220,w=p.gr?Math.sin(p.t*14)*.8*sp:0,id=Math.sin(p.t*3),air=!p.gr,up=p.vy<0,sq=Math.max(p.sq,0);
 c.save();c.translate(p.x-cam,p.y);c.scale(p.f*(1+sq*1.5),1-sq*1.5);
 const leg=(x,a)=>{c.save();c.translate(x,-14);c.rotate(a);c.fillStyle='#4a3520';c.fillRect(-3,0,6,13);c.fillStyle='#2b1d12';c.fillRect(-3,11,9,4);c.restore()};
 const arm=a=>{c.save();c.translate(0,-28+id*.5);c.rotate(a);c.fillStyle='#e0a878';c.fillRect(-2.5,0,5,13);c.restore()};
 leg(-3,air?(up?-.6:.5):w);leg(3,air?(up?.5:-.5):-w);
 c.fillStyle='#8a5a2b';c.beginPath();c.roundRect(-14,-30+id*.5,8,14,3);c.fill();
 c.fillStyle='#3aa060';c.beginPath();c.roundRect(-8,-31+id*.5,16,18,4);c.fill();c.fillStyle='#e8dcae';c.fillRect(-2,-31+id*.5,4,18);
 arm(air?(up?-2.6:-1.6):-w*1.2);
 c.fillStyle='#e0a878';c.beginPath();c.arc(1,-37+id*.5,7.5,0,7);c.fill();
 c.fillStyle='#222';c.beginPath();c.arc(4,-37+id*.5,1.5,0,7);c.fill();
 c.fillStyle='#c9a45a';c.beginPath();c.ellipse(1,-42+id*.5,11,3,0,0,7);c.fill();
 c.fillStyle='#d9b56a';c.beginPath();c.arc(1,-42+id*.5,7,Math.PI,0);c.fill();c.fillStyle='#8a5a2b';c.fillRect(-6,-44+id*.5,14,2);
 arm(air?(up?-2.6:-1.6):w*1.2);
 c.restore()}
function render(t){const c=ctx;c.setTransform(dpr,0,0,dpr,0,0);
 c.fillStyle=SK;c.fillRect(0,0,W,H);lay(far,.2);lay(mid,.5);
 for(const f of FF){const X=(((f.x-cam*.8)%W)+W)%W,Y=f.y+Math.sin(t/700+f.p)*10;c.fillStyle='rgba(255,240,150,'+(.35+.35*Math.sin(t/400+f.p))+')';c.beginPath();c.arc(X,Y,2.2,0,7);c.fill()}
 if(G&&st!=='menu'){tiles();
  for(const b of G.B){if(b.got)continue;const X=b.x-cam;if(X<-20||X>W+20)continue;c.strokeStyle='#f2c230';c.lineWidth=5;c.lineCap='round';c.beginPath();c.arc(X,b.y+Math.sin(t/300+b.x)*3-2,8,Math.PI*1.1,Math.PI*1.9,true);c.stroke()}
  for(const k of G.C){const X=k.x-cam;c.fillStyle='#c9b79a';c.fillRect(X,k.y-44,3,44);c.fillStyle=k.on?'#5fd07f':'#f2c230';c.beginPath();c.moveTo(X+3,k.y-44);c.lineTo(X+24,k.y-36);c.lineTo(X+3,k.y-28);c.fill()}
  for(const e of G.E){if(!e.al)continue;c.save();c.translate(e.x-cam,e.y);c.scale(e.d,1);c.strokeStyle='#2a1212';c.lineWidth=2;
   for(let i=0;i<3;i++){const o=Math.sin(t/90+i*2)*3;c.beginPath();c.moveTo(-8+i*8,-6);c.lineTo(-10+i*8+o,0);c.stroke()}
